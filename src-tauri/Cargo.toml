[package]
name = "simvizion-mod-manager"
description = "SimVizion Mod Manager for Farming Simulator 25"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# All reading of Farming Simulator files; this crate is only the command layer.
fsmm-core = { path = "../crates/fsmm-core" }
# RFC 3339 time of the newest settings backup for the frontend.
humantime = "2.4.0"
# Command arguments, results and errors.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri = { version = "2", features = [] }
# Folder picker for "Add mod folder" (called from Rust only).
tauri-plugin-dialog = "2.8.4"
# One running copy at a time: a second launch focuses the first. Two copies would each have their
# own "an operation is running" flags, so two file operations could work on the same folders
# (release review F-18). 2.5.5 was published 2026-10-28, more than two weeks before it was added.
tauri-plugin-single-instance = "2.5.5"
# Opens a profile folder or reveals a mod in Explorer (called from Rust only).
tauri-plugin-opener = "2.7.3"
# The app's own opt-in updates from the GitHub release feed, with signature checks (plan M8;
# called from Rust only).
tauri-plugin-updater = "2.14.1"
